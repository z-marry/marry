<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测测你的本命定居城市</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=&#39;http://www.w3.org/2000/svg&#39; viewBox=&#39;0 0 24 24&#39;%3E%3Cpath fill=&#39;%236F816A&#39; d=&#39;M12 21s-7-5.3-7-11a7 7 0 1 1 14 0c0 5.7-7 11-7 11z&#39;/%3E%3Ccircle cx=&#39;12&#39; cy=&#39;10&#39; r=&#39;2.5&#39; fill=&#39;%23F6F3EE&#39;/%3E%3C/svg%3E">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg:#F6F3EE;
    --card:#FFFFFF;
    --ink:#48443F;
    --ink-soft:#8A8478;
    --line:#ECE7DF;
    --sage:#9AAB96;
    --sage-deep:#6F816A;
    --rose:#D9B4A5;
    --rose-deep:#B98B7A;
    --blue:#A9BDC4;
    --cream:#F0E9DC;
    --warn:#C2A55F;
  }
  html,body{ height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink);
    line-height:1.7; letter-spacing:.01em;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:480px; margin:0 auto; min-height:100vh; position:relative; }

  /* ===== 顶部标题栏 ===== */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:rgba(246,243,238,.92); backdrop-filter:blur(8px);
    padding:14px 18px 12px; border-bottom:1px solid var(--line);
  }
  .topbar h1{
    font-size:16px; font-weight:600; color:var(--ink); text-align:center;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .topbar h1 .pin{ width:16px;height:16px; }

  /* ===== 屏幕切换 ===== */
  .screen{ display:none; padding:22px 18px 40px; }
  .screen.active{ display:block; animation:fadeIn .32s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  @media (prefers-reduced-motion:reduce){ .screen.active{ animation:none; } }

  /* ===== 封面 ===== */
  .cover{ text-align:center; padding-top:14px; }
  .cover .badge{
    display:inline-block; font-size:12px; color:var(--sage-deep);
    background:var(--cream); border-radius:999px; padding:5px 14px; margin-bottom:22px;
  }
  .cover .t-main{ font-size:26px; font-weight:700; line-height:1.4; color:var(--ink); }
  .cover .t-sub{
    font-size:14px; color:var(--ink-soft); margin:12px 0 26px; line-height:1.8;
  }
  .cover .city-illust{
    width:100%; max-width:340px; margin:0 auto 26px; position:relative;
  }
  .city-illust svg{ width:100%; height:auto; display:block; }
  .start-btn{
    display:block; width:100%; max-width:280px; margin:4px auto 14px;
    padding:15px 0; border:none; border-radius:999px;
    background:var(--sage); color:#fff; font-size:16px; font-weight:600;
    cursor:pointer; letter-spacing:.04em; box-shadow:0 6px 18px rgba(106,124,98,.28);
    transition:transform .15s ease;
  }
  .start-btn:active{ transform:scale(.97); }
  .cover .note{ font-size:12px; color:var(--ink-soft); }
  .cover .note span{ display:block; margin-top:2px; }

  /* ===== 进度 ===== */
  .progress{ margin:2px 0 22px; }
  .progress .bar{ height:6px; background:var(--line); border-radius:999px; overflow:hidden; }
  .progress .bar i{
    display:block; height:100%; width:0%;
    background:linear-gradient(90deg,var(--sage),var(--blue));
    border-radius:999px; transition:width .4s ease;
  }
  .progress .meta{
    display:flex; justify-content:space-between; margin-top:8px;
    font-size:12px; color:var(--ink-soft);
  }

  /* ===== 答题区 ===== */
  .q-area{ }
  .q-num{ font-size:12px; color:var(--sage-deep); letter-spacing:.08em; margin-bottom:10px; }
  .q-title{ font-size:18px; font-weight:600; line-height:1.6; margin-bottom:20px; }
  .opts{ display:flex; flex-direction:column; gap:12px; }
  .opt{
    border:1px solid var(--line); border-radius:16px; padding:15px 16px;
    background:var(--card); cursor:pointer; position:relative;
    font-size:14.5px; color:var(--ink); line-height:1.6;
    transition:border-color .15s ease, background .15s ease;
  }
  .opt .o-mark{
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    width:20px; height:20px; border:1px solid var(--line); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .opt.sel{ border-color:var(--sage); background:#F4F7F1; }
  .opt.sel .o-mark{
    border-color:var(--sage); background:var(--sage);
  }
  .opt.sel .o-mark::after{
    content:""; width:6px; height:10px; border:solid #fff; border-width:0 2px 2px 0;
    transform:rotate(45deg) translate(-1px,-1px);
  }
  .nav-row{ display:flex; justify-content:space-between; align-items:center; margin-top:26px; gap:12px; }
  .back-btn{
    border:none; background:transparent; color:var(--ink-soft);
    font-size:14px; cursor:pointer; padding:10px 6px; min-width:44px; min-height:44px;
  }
  .next-btn{
    flex:1; border:none; border-radius:999px; padding:14px 0;
    background:var(--sage); color:#fff; font-size:15px; font-weight:600;
    cursor:pointer; letter-spacing:.03em; transition:background .15s ease;
  }
  .next-btn:disabled{ background:#D8D3C8; cursor:not-allowed; }

  /* ===== 结果页 ===== */
  .result .r-head{ text-align:center; }
  .r-badge{
    display:inline-block; font-size:12px; padding:5px 14px; border-radius:999px;
    background:var(--cream); color:var(--sage-deep); margin-bottom:14px;
  }
  .r-city{ font-size:34px; font-weight:700; line-height:1.2; color:var(--ink); }
  .r-region{ font-size:13px; color:var(--ink-soft); margin-top:6px; }
  .r-tags{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:18px 0 4px; }
  .r-tags span{
    font-size:12px; color:var(--ink-soft); background:var(--card);
    border:1px solid var(--line); border-radius:999px; padding:5px 12px;
  }
  .r-card{
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:20px 20px 22px; margin-top:22px; box-shadow:0 8px 24px rgba(120,110,95,.06);
  }
  .r-card .sec{ margin-top:18px; }
  .r-card .sec:first-child{ margin-top:0; }
  .r-card .sec h3{
    font-size:13px; color:var(--rose-deep); letter-spacing:.04em;
    display:flex; align-items:center; gap:7px; margin-bottom:8px;
  }
  .r-card .sec h3 svg{ width:15px; height:15px; flex:none; }
  .r-card .sec p{ font-size:14px; color:var(--ink); line-height:1.85; }
  .share-tip{
    text-align:center; font-size:12px; color:var(--ink-soft);
    margin:18px 0 6px; background:var(--cream); border-radius:12px; padding:10px 12px;
  }
  .restart-btn{
    display:block; width:100%; border:none; border-radius:999px;
    padding:15px 0; background:var(--rose); color:#fff;
    font-size:15px; font-weight:600; cursor:pointer; margin-top:18px;
    transition:transform .15s ease;
  }
  .restart-btn:active{ transform:scale(.97); }

  .foot{ text-align:center; font-size:11px; color:#B9B2A6; padding:10px 18px 24px; }
</style>

/* ========== 状态 ========== */
var answers = [];        // 已选选项索引，-1 未选
var cur = 0;             // 当前题号
var el = {};

function $(id){ return document.getElementById(id); }

/* ========== 渲染答题 ========== */
function renderQuiz(){
  var q = QUESTIONS[cur];
  var area = el.qArea;
  area.innerHTML = "";
  var num = document.createElement("div");
  num.className = "q-num"; num.textContent = "QUESTION " + (cur+1) + " / 15";
  var title = document.createElement("div");
  title.className = "q-title"; title.textContent = q.t;
  area.appendChild(num); area.appendChild(title);
  var opts = document.createElement("div"); opts.className = "opts";
  q.o.forEach(function(opt, i){
    var d = document.createElement("div");
    d.className = "opt" + (answers[cur] === i ? " sel" : "");
    var txt = document.createElement("span"); txt.textContent = opt[0];
    var mark = document.createElement("span"); mark.className = "o-mark";
    d.appendChild(txt); d.appendChild(mark);
    d.addEventListener("click", function(){ select(i); });
    opts.appendChild(d);
  });
  area.appendChild(opts);
  updateProgress();
}

function select(i){
  answers[cur] = i;
  var cards = el.qArea.querySelectorAll(".opt");
  for(var k=0;k<cards.length;k++) cards[k].classList.remove("sel");
  cards[i].classList.add("sel");
  el.btnNext.disabled = false;
}

function updateProgress(){
  el.progBar.style.width = ((cur+1)/15*100) + "%";
  el.progNum.textContent = "第 " + (cur+1) + " / 15 题";
}

function next(){
  if(answers[cur] === -1) return;
  if(cur < 14){ cur++; renderQuiz(); el.btnNext.disabled = (answers[cur]===-1); }
  else computeResult();
}
function back(){
  if(cur === 0) return;
  cur--; renderQuiz(); el.btnNext.disabled = (answers[cur]===-1);
}

/* ========== 计算结果 ========== */
function computeResult(){
  var w = [0,0,0,0,0,0];
  for(var i=0;i<15;i++){
    var vec = QUESTIONS[i].o[answers[i]][1];
    for(var d=0;d<6;d++) w[d] += vec[d];
  }
  var best=0, bestScore=-1;
  for(var c=0;c<CITIES.length;c++){
    var dims = CITIES[c][3], score=0;
    for(var d=0;d<6;d++) score += dims[d]*w[d];
    if(score > bestScore){ bestScore=score; best=c; }
  }
  var city = CITIES[best];
  el.rType.textContent = city[2]===1 ? "国内城市" : "海外城市";
  el.rCity.textContent = city[0];
  el.rRegion.textContent = city[1];
  el.rHi.textContent = city[4];
  el.rWho.textContent = city[5];
  el.rCon.textContent = city[6];
  /* 标签：取用户偏好最强的三个维度对应的城市强项 */
  var dimNames=["偏爱温暖气候","亲近自然","享受慢节奏","热爱美食","喜欢热闹","看重发展"];
  var idx=[0,1,2,3,4,5].sort(function(a,b){return w[b]-w[a];});
  el.rTags.innerHTML="";
  for(var t=0;t<3;t++){ var s=document.createElement("span"); s.textContent=dimNames[idx[t]]; el.rTags.appendChild(s); }
  show("scr-result");
}

/* ========== 屏幕切换 ========== */
function show(id){
  var all = document.querySelectorAll(".screen");
  for(var i=0;i<all.length;i++) all[i].classList.remove("active");
  $(id).classList.add("active");
  window.scrollTo(0,0);
}
function reset(){
  answers = []; for(var i=0;i<15;i++) answers.push(-1);
  cur = 0; renderQuiz(); el.btnNext.disabled = true;
  show("scr-quiz");
}

/* ========== 绑定 ========== */
document.addEventListener("DOMContentLoaded", function(){
  el.qArea = $("q-area"); el.btnNext=$("btn-next"); el.btnBack=$("btn-back");
  el.btnStart=$("btn-start"); el.btnRestart=$("btn-restart");
  el.progBar=$("prog-bar"); el.progNum=$("prog-num");
  el.rType=$("r-type"); el.rCity=$("r-city"); el.rRegion=$("r-region");
  el.rHi=$("r-hi"); el.rWho=$("r-who"); el.rCon=$("r-con"); el.rTags=$("r-tags");
  for(var i=0;i<15;i++) answers.push(-1);
  $("btn-start").addEventListener("click", function(){ reset(); });
  $("btn-next").addEventListener("click", next);
  $("btn-back").addEventListener("click", back);
  $("btn-restart").addEventListener("click", function(){ reset(); });
});
</script>
